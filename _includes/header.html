<!-- Header -->
<header id="header"{% if page.layout == 'landing' %} class="alt"{% endif %}>
  <h1><a href="{{ site.baseurl }}/index.html">{{ site.title }}</a></h1>
<nav id="nav">
  <ul class="nav-links">
    <li{% if page.url == '/' or page.url == '/index.html' %} class="active"{% endif %}><a href="{{ site.baseurl }}/index.html">Home</a></li>
    {% for my_page in site.pages %}
    {% if my_page.title %}
      <li{% if page.url == my_page.url %} class="active"{% endif %}><a href="{{ my_page.url | prepend: site.baseurl }}">{{ my_page.title }}</a></li>
    {% endif %}
    {% endfor %}
  </ul>
  <ul class="nav-toggle-wrap">
    <li class="special">
      <a href="#menu" class="menuToggle"><span>Menu</span></a>
      <div id="menu">
        <ul>
          <li{% if page.url == '/' or page.url == '/index.html' %} class="active"{% endif %}><a href="{{ site.baseurl }}/index.html">Home</a></li>
          {% for my_page in site.pages %}
          {% if my_page.title %}
            <li{% if page.url == my_page.url %} class="active"{% endif %}><a href="{{ my_page.url | prepend: site.baseurl }}">{{ my_page.title }}</a></li>
          {% endif %}
          {% endfor %}
        </ul>
      </div>
    </li>
  </ul>
</nav>
</header>
